[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-vision-inspection"
version = "0.3.0"
description = "Recipe-driven industrial machine vision with acquisition, calibration, metrology, MSA, drift, and benchmark tooling."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-contrib-python>=4.8"]

[project.scripts]
inspect-image = "vision_inspection.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["vision_inspection"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.setuptools.packages.find]
where = ["src"]
